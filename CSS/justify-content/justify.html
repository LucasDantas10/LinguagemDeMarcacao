<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Justify Content</title>
    <style>
      * {
        padding: 0;
        box-sizing: border-box;
        margin: 0;
      }
      .navbar-gamer {
        display: flex;
        background: #0f172a;
        align-items: center;
        padding: 10px 24px;
        height: 50px;
        justify-content: space-between;
      }
      .menu-links {
        display: flex;
        gap: 20px;
      }
      a {
        color: #ffff;
        text-decoration: none;
      }
      div {
        color: #ffff;
      }
      .meio-centralizado {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 500px;
        height: 300px;
        background-color: #0f172a;
        border-radius: 10px;
        margin: 250px auto
      }
    </style>
  </head>
  <body>
    <header class="navbar-gamer">
      <div class="logo">DEV GAMER</div>
      <nav class="menu-links">
        <a href="">Inicio</a>
        <a href="">Catálogo</a>
        <a href="">Perfil</a>
      </nav>
    </header>
    <div class="meio-centralizado">
      <h1>DEV GAMER</h1>
      <p>Somos uma loja profissional em desenvolver jogos</p>
    </div>
  </body>
</html>
