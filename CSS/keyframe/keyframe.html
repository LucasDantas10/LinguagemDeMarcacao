<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animação Keyframe</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            padding: 15px;
            color: white;
            border-bottom: 5px solid rgb(1, 1, 61);
            border-radius: 10px;
        }

        @keyframes
            flutuar{
                0%{
                    transform: translateY(0px);
                }
                50%{
                    transform: translateY(20px);
                }
                /* Volta suavemente para o ponto inicial*/
                100%{
                    transform: translateY(0px);
                }

            }
            @keyframes
                flutuar1{
                    0%{
                        transform: translateY(20px);
                    }
                    50%{
                        transform: translateY(0px);
                    }
                    100%{
                        transform: translateY(20px);
                    }
                }
        
            .bau-geral{
                display: flex;
            }

        .icone-bau{
            margin: 20px;
            width: 100px;
            height: auto;
            animation: flutuar 2.5s ease-in-out infinite;
        }
        .icone-bau1{
            margin: 20px;
            width: 100px;
            height: auto;
            animation: flutuar1 2.5s ease-in-out infinite;
        }
        a{
            text-decoration: none;
            color: white;
        }
        
    </style>
  </head>
  <body>
    <header class="navbar">
      <h1>Gamer Store</h1>
      <nav>
        <a href="">Início</a>
        <a href="">Jogos</a>
        <a href="">Contato</a>
      </nav>
    </header>
    <main>
      <div class="bau-geral">
          <div class="card-jogo">
            <img src="6.svg" alt="" class="icone-bau">
          </div>
          <div class="card-jogo">
            <img src="7.svg" alt="" class="icone-bau1">
          </div>
      </div>
    </main>
  </body>
</html>
